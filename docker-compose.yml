# The full stack.
#
#   docker compose up --build
#
# Postgres holds everything that must survive a restart: accounts, sessions, projects, and the
# queue. Redis holds the two things that are better off ephemeral -- rate-limit counters and the
# compile cache -- and losing all of it costs nothing but a few recompiles.
#
# Every service has a health check and every dependency waits on it, because "postgres is
# listening" and "postgres is ready" are not the same moment and starting into the gap produces a
# failure that looks like a bug in the application.

name: robo-journey

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-robo_journey}
      # Explicit rather than inherited from the host locale, so an index built on one machine
      # sorts the same way on another.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-d` and `-U` matter: without them pg_isready checks the default database and reports
      # ready while the one this actually uses is still being created.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-robo} -d ${POSTGRES_DB:-robo_journey}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      # Loopback only. The service reaches this over the compose network when it runs in a
      # container; this is here so it can also be reached by a service running in a terminal,
      # which is the normal way to work on the backend.
      - "127.0.0.1:28632:5432"

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # No persistence configured on purpose: nothing here is worth keeping across a restart, and
    # an AOF file that grows unbounded is a problem nobody asked for. `allkeys-lru` means a full
    # cache evicts rather than starting to refuse writes, which would take rate limiting with it.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:28633:6379"

  service:
    # Behind a profile, so `docker compose up` starts only Postgres and Redis and leaves port
    # 28610 to a service running in a terminal -- which is how the backend is normally worked on.
    # `docker compose --profile packaged up` runs the built image instead.
    profiles: ["packaged"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-robo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-robo_journey}
      REDIS_URL: redis://redis:6379
      RJ_SERVICE_PORT: 28610
      RJ_SERVICE_HOST: 0.0.0.0
      RJ_COMPILER_MODE: local
      RJ_STATIC_DIR: /app/public
      RJ_ACCESS_CAPACITY: ${RJ_ACCESS_CAPACITY:-10}
      RJ_ACCESS_SESSION_MINUTES: ${RJ_ACCESS_SESSION_MINUTES:-60}
      RJ_ACCESS_COOLDOWN_MINUTES: ${RJ_ACCESS_COOLDOWN_MINUTES:-20}
      RJ_ACCESS_IDLE_MINUTES: ${RJ_ACCESS_IDLE_MINUTES:-2}
      # Credits a confirmed account starts with.
      RJ_SIGNUP_CREDITS: ${RJ_SIGNUP_CREDITS:-100}
      # Links in outgoing mail are built from this, so it has to be the address people actually
      # reach the app at rather than anything derived from a request.
      RJ_PUBLIC_URL: ${RJ_PUBLIC_URL:-http://localhost:28610}
      RJ_REQUIRE_VERIFIED_EMAIL: ${RJ_REQUIRE_VERIFIED_EMAIL:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-robo-journey <no-reply@localhost>}
      # Read from the host environment or .env; never baked into the image.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Bound to loopback. Reaching this from another machine should be a deliberate act involving
      # something that terminates TLS, not a side effect of running compose.
      - "127.0.0.1:${RJ_PUBLISH_PORT:-28610}:28610"
    # Compilation writes a sketch to a temporary directory and nothing else writes anywhere. A
    # read-only root filesystem makes that a property of the container rather than a habit.
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # An AVR compile is short but not free, and an unbounded container competing with
          # Postgres for memory is how a machine falls over under load rather than slowing down.
          cpus: "2.0"
          memory: 2g

  caddy:
    # Behind a profile as well, and started only when this machine's 80 and 443 are free.
    # `deploy/install.sh` checks before enabling it; if nginx or anything else is already there it
    # writes a site file for that proxy instead, because two things fighting over 443 is an outage
    # rather than a configuration.
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - service
    environment:
      # Not `:?` -- compose interpolates every service in the file even when you name two on the
      # command line, so a required variable here made `docker compose up postgres redis` fail on
      # any machine without a domain set. That is the ordinary dev case. Caddy runs only under the
      # edge profile, and an empty site address is a Caddyfile parse error, so it still fails
      # loudly -- just at its own startup rather than in everybody else's.
      RJ_DOMAIN: ${RJ_DOMAIN:-}
      RJ_ACME_EMAIL: ${RJ_ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Losing this volume means re-issuing on every deploy,
      # and Let's Encrypt counts those per week.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${RJ_HTTP_PORT:-80}:80"
      - "${RJ_HTTPS_PORT:-443}:443"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
